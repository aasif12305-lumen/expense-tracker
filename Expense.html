<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Expence calculator</title>
    <link rel="stylesheet" href="Expense.css">
  </head>
  <body>

    <div class="container">

      <h2 class="header">My Expense Tracker</h2>
      <div class="headerbox">
      <div class="balancebox">
        <h3 class="baltitle">Your balance</h3>
        <h2 id="balance">00</h2>
         </div>
        <div class="box2">
        <div class="incomebox">
          <h4 class="incometitle">Income</h4>
          <h4 id="income">00</h4>
        </div>
        <div class="expencebox">
         <h4 class="expencetitle">Expenses</h4>
          <h4 id="expence">00</h4>
          </div>
          </div>
     </div>
      <div class="transactionbox">
                            
        <div class="listbox">
          
          <p class="Transaction">Transaction</p>
          <div class="popuprelbox">
              <div class="delconfirm">
    <i> <h3>Did you want to delete<span class="delspan"></span></h3></i> <br> 
  <nav class="navbutton"> <button class="cancel_btn">Cancel</button>
      <button class="delconfirm_btn">Yes</button></nav>  
    </div>
          <ul class="transactionlist">

            <!--space for the expence and income-->
          </ul>
          </div>
        </div>

      <div class="formbox">
        <h2 class="formtitle">Add Transaction</h2>
        <form class="form">
          <label for="desc">Description:</label>
          <input type="text" id="desc">
          <label for="amount">Amount:</label>
          <input type="number" id="amount">
          <small class="notice">use negative(-)for expenses</small>
          <button id="Addbtn">Add Transaction</button>
        </form>
      </div>
            </div>
    </div>
    
  </body>
  <script src="Expense.js"></script>
</html>
